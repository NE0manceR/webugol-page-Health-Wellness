<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet"
    href="style/css/style.min.css">
  <!-- FONTS -->
  <link rel="preconnect"
    href="https://fonts.googleapis.com">
  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap"
    rel="stylesheet">

  <link rel="preconnect"
    href="https://fonts.googleapis.com">
  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap"
    rel="stylesheet">
  <!-- FONTS -->
  <title>Document</title>
</head>

<body>
  <section class="wellness-hero">
    <div class="wellness-hero__video-filter"></div>

    <video class="wellness-hero__video"
      autoplay
      muted
      loop
      src="assets/hero-video.mp4"></video>
    <div class="wellness-container">
      <div class="wellness-hero__text">
        <h1 class="wellness-hero__title">
          Transforming Health & Wellness Marketing
        </h1>
        <p class="wellness-hero__description">
          We’re a performance-driven marketing agency, maximizing ROI with data-driven strategies that fuel growth and
          create lasting impact.
        </p>
        <button class="wellnes-primary-button ">Start Your Journey</button>
      </div>
      <div class="wellness-hero__capsule-wrap">
        <img src="./assets/images/hero/capsule.png"
          alt="capsule">
        <img src="./assets/images/hero/capsule.png"
          alt="capsule">
      </div>
    </div>

  </section>

  <section class="partnership">
    <div class="partnership__stage">
      <h2 class="partnership__title">CHECK THE RESULTS OF PARTNERSHIP
WITH WEBUGOL</h2>

      <div class="partnership__card partnership__card--1">
        <img class="partnership__card-bg" src="./assets/images/partnership/card-1-bg.jpg" alt="">
        <div class="partnership__card-overlay"></div>
        <img class="partnership__card-logo" src="./assets/images/partnership/logo-ways2well.png" alt="Ways2Well + Atlas Men's Health">
      </div>

      <div class="partnership__card partnership__card--2">
        <img class="partnership__card-bg" src="./assets/images/partnership/card-2-bg.jpg" alt="">
        <div class="partnership__card-overlay"></div>
        <img class="partnership__card-logo" src="./assets/images/partnership/logo-valhalla.png" alt="Valhalla Vitality">
      </div>

      <div class="partnership__card partnership__card--3">
        <img class="partnership__card-bg" src="./assets/images/partnership/card-3-bg.jpg" alt="">
        <div class="partnership__card-overlay"></div>
        <img class="partnership__card-logo" src="./assets/images/partnership/logo-atlas.png" alt="Atlas Men's Health">
      </div>

      <div class="partnership__card partnership__card--4">
        <img class="partnership__card-bg" src="./assets/images/partnership/card-4-bg.jpg" alt="">
        <div class="partnership__card-overlay"></div>
        <img class="partnership__card-logo" src="./assets/images/partnership/logo-p.png" alt="P">
      </div>

      <div class="partnership__card partnership__card--5">
        <img class="partnership__card-bg" src="./assets/images/partnership/card-5-bg.jpg" alt="">
        <div class="partnership__card-overlay"></div>
        <img class="partnership__card-logo" src="./assets/images/partnership/logo-liferx.png" alt="LifeRX MD">
      </div>

      <div class="partnership__card partnership__card--6">
        <img class="partnership__card-bg" src="./assets/images/partnership/card-6-bg.jpg" alt="">
        <div class="partnership__card-overlay"></div>
        <img class="partnership__card-logo" src="./assets/images/partnership/logo-fusionlabs.png" alt="Fusionlabs">
      </div>

      <div class="partnership__card partnership__card--7">
        <img class="partnership__card-bg" src="./assets/images/partnership/card-7-bg.jpg" alt="">
        <div class="partnership__card-overlay"></div>
        <img class="partnership__card-logo" src="./assets/images/partnership/logo-uberdoc.png" alt="UberDoc">
      </div>

      <button class="partnership__button">JOIN THE BEST</button>
    </div>
  </section>

  <script>
    const partnership = document.querySelector('.partnership');
    if (partnership) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            partnership.classList.add('is-visible');
          } else {
            partnership.classList.remove('is-visible');
          }
        });
      }, { threshold: 0.50 });
      observer.observe(partnership);
    }
  </script>
</body>

</html>
